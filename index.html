<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>한파 피하기 - Cold Wave Dodge</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0a1020;
        color: #e3f2fd;
        font-family: -apple-system, system-ui, "Segoe UI", "Apple SD Gothic Neo",
          "Malgun Gothic", sans-serif;
        gap: 12px;
        padding: 16px;
      }
      h1 {
        font-size: 22px;
        margin: 0;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      canvas {
        background: #0f1929;
        border: 2px solid #2c3e50;
        border-radius: 8px;
        max-width: 100%;
        height: auto;
        image-rendering: pixelated;
      }
      .hint {
        font-size: 13px;
        opacity: 0.7;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>🧊 한파 피하기 ❄️</h1>
    <canvas id="game" width="640" height="480"></canvas>
    <div class="hint">
      ← → 로 이동 · Space로 시작 · R로 재시작 · 🔥 모닥불은 보너스 +5점
    </div>
    <script type="module">
      import { bootstrap } from './src/main.js';
      bootstrap(document.getElementById('game'));
    </script>
  </body>
</html>
